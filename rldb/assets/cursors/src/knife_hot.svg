    <path d="M-13,-11.5 Q0,-2.5 13,-11.5 Q12.5,-6.5 10.5,-4.2 Q0,1.5 -10.5,-4.2 Q-12.5,-6.5 -13,-11.5 Z" fill="#140b04" stroke="#140b04" stroke-width="3.2" stroke-linejoin="round"/>
    <path d="M-13,-11.5 Q0,-2.5 13,-11.5 Q12.5,-6.5 10.5,-4.2 Q0,1.5 -10.5,-4.2 Q-12.5,-6.5 -13,-11.5 Z" fill="url(#gold)"/>
    <path d="M-11.6,-10.2 Q0,-2.6 11.6,-10.2" fill="none" stroke="#fff6d8" stroke-width="0.8" stroke-opacity="0.7"/>
    <rect x="-3.0" y="-3.5" width="6.0" height="17" rx="1.6" fill="#140b04" stroke="#140b04" stroke-width="3.0"/>
